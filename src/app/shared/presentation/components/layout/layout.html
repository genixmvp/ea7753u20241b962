<mat-toolbar>

  <mat-toolbar-row>
    <img matListItemAvatar class="avatar" [alt]="'Hertz Logo'" [src]="HertzLogoUrl"/>
    <h1>Hertz Fleet Safety Management Platform</h1>
    <div class="mat-spacer"></div>
    @for (option of options(); track option.label) {
      <a mat-button [routerLink]="option.link" routerLinkActive="active">{{ option.label | translate }}</a>
    }
    <app-language-switcher/>
  </mat-toolbar-row>
</mat-toolbar>
<router-outlet/>
